name: Bug Report
description: Report something not working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the sidebar under "Pickit Generator". The .exe filename
        never changes, so it cannot tell you — use the sidebar, or right-click the
        .exe → Properties → Details.
      placeholder: e.g. v4.50.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Opened the Economy tab
        2. Pressed Generate
        3. ...
  - type: textarea
    id: debug
    attributes:
      label: Debug tab output
      description: Open the Debug tab, copy the output, and paste it here.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checklist
      options:
        - label: I've checked for existing issues (open and closed)
          required: true
        - label: I'm using the latest release
          required: false
